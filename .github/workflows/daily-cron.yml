name: Daily Job Ingestion & AI Classification Cron

on:
  schedule:
    # Runs every 6 hours (at minute 0 of 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-classify:
    name: Run Job Ingestion Cron
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Cron Script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          NODE_ENV: production
        run: npm run daily-cron
